name: Refactor checks

on:
  push:
    branches: [refactoring]
  pull_request:
    branches: [master]

jobs:
  bounded-refactor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install device-free test dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run bounded refactor suite
        run: bash scripts/test-refactor.sh
