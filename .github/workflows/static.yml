name: multi-platform-static

# CI is intentionally manual for this repository. Keep execution under explicit
# user control; do not add push, pull_request, schedule, or other automatic
# repository-event triggers without an explicit project decision.
on:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [armv7, arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Shell and platform regression checks
        run: ./ci/verify-static.sh
      - name: Selected target
        run: ./build.sh --platform "${{ matrix.target }}" --print-platform

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Prepare isolated test environment
        run: ./scripts/prepare-python-env.sh apps
      - name: Run bounded unit and refactor tests
        env:
          PYTHON: ${{ github.workspace }}/work/venv-apps/bin/python
        run: bash scripts/test-refactor.sh
